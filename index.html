<html lang="ja"><head>

<style>
:root{--bg:#f2faf4;--card:#fff;--g:#70a97e;--d:#356847;--m:#789082;--line:#d7eadc;--pink:#e997aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#31513b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:620px;margin:auto;padding:20px 16px 40px}
header{text-align:center;padding:8px 0 17px}
.brand-mark{display:inline-flex;align-items:baseline;justify-content:center;letter-spacing:-.055em;line-height:1;font-family:Georgia,"Times New Roman",serif;font-weight:700;color:#3d6950}
.brand-mark span:first-child{font-size:42px}
.brand-mark span:last-child{font-size:40px}
.brand-mark .ten{display:inline-flex;align-items:baseline;margin:0 -1px;position:relative;top:-1px;color:#78a982;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-weight:800;letter-spacing:-.12em}
.brand-mark .ten i{font-style:normal;display:inline-block}
.brand-mark .ten i:first-child{font-size:31px;font-weight:500;transform:scaleX(.72);transform-origin:right bottom}
.brand-mark .ten i:last-child{font-size:31px;font-weight:850;transform:scaleX(.88);transform-origin:left bottom}
.jp{font-size:12px;color:var(--m);letter-spacing:.18em;margin-top:7px;font-weight:700}.tag{font-size:11px;color:var(--m);margin-top:6px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.nav button{border:0;background:#e4f2e7;color:#6f8d78;border-radius:14px;padding:10px 2px;font-weight:800;font-size:10px}.nav button.active{background:var(--g);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:20px;box-shadow:0 8px 28px #35684710}.hero{text-align:center}.status{font-size:13px;font-weight:800;color:var(--g);min-height:20px}.next{font-size:12px;color:var(--m);margin-top:3px}
.clover{width:250px;height:250px;margin:10px auto 2px;position:relative}
.clover svg{width:100%;height:100%;overflow:visible}
.leafShape{fill:#eaf5ec;stroke:#a7c9ae;stroke-width:4;stroke-linejoin:round;transition:fill .25s,opacity .25s,filter .25s}
.leafShape.on{fill:#79b686;stroke:#5f9f6d}
.clover-core{fill:#fff;stroke:#6fa77d;stroke-width:3}
.clover-stem-svg{fill:none;stroke:#75a980;stroke-width:6;stroke-linecap:round}
.ct{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none}
.charge{font-size:29px;font-weight:900;color:var(--d)}
.clabel{font-size:10px;font-weight:900;color:var(--m);letter-spacing:.12em}
.tap{width:150px;height:150px;border:0;border-radius:50%;background:linear-gradient(145deg,#efa9b8,#df8399);color:#fff;font-size:27px;font-weight:900;cursor:pointer;box-shadow:0 10px 25px #e0879c40}.tap.ready{animation:pulse 1.2s infinite}.tap:disabled{background:#dce9df;color:#9bafa1;box-shadow:none;animation:none}@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 13px 30px #e0879c55}}
.window{font-size:12px;color:var(--m);margin:10px 0 17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:#f5faf6;border-radius:15px;padding:12px 3px;text-align:center}.stat b{display:block;font-size:21px;color:var(--d)}.stat span{font-size:10px;color:var(--m)}.small{font-size:11px;color:var(--m)}.progress{height:10px;background:#e7f1e9;border-radius:99px;overflow:hidden;margin:10px 0 5px}.progress i{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:.3s}
.ticket{background:#f5faf6;border-radius:18px;padding:15px;text-align:center;margin-bottom:12px}.gacha{width:100%;border:0;border-radius:16px;padding:15px;background:var(--g);color:#fff;font-weight:800;font-size:16px}.result{text-align:center;font-size:18px;font-weight:800;min-height:28px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#f7fbf8;border:1px solid var(--line);border-radius:18px;padding:15px;text-align:center}.art{font-size:45px;margin:7px}.realcard{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block;margin-bottom:9px}.resultcard{display:block;width:170px;aspect-ratio:1/1;object-fit:cover;border-radius:14px;margin:10px auto}.locked{opacity:.45}.trophy{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px}.icon{font-size:26px;width:38px;text-align:center}.hidden{display:none}@media(max-width:390px){.clover{transform:scale(.9);margin-top:-2px;margin-bottom:-10px}.tap{width:132px;height:132px}}

let s=load();function load(){try{let x=JSON.parse(localStorage.getItem(key)||"{}");return{slots:[...new Set((x.slots||[]).map(Number))].sort((a,b)=>a-b),tickets:+x.tickets||0,col:x.col||[],best:+x.best||0}}catch(e){return{slots:[],tickets:0,col:[],best:0}}}function save(){localStorage.setItem(key,JSON.stringify(s))}
function id(t=Date.now()){return Math.floor(t/SLOT)}function st(i){return i*SLOT}function day(t){let d=new Date(t);return[d.getFullYear(),d.getMonth(),d.getDate()].join("/")}function today(){let k=day(Date.now());return s.slots.filter(i=>day(st(i))==k).length}
function run(i){let n=1;for(let j=i;j>0;j--){if(s.slots[j]-s.slots[j-1]===1)n++;else break}return n}function best(){let b=0;s.slots.forEach((_,i)=>b=Math.max(b,run(i)));return b}function current(now){if(!s.slots.length)return 0;let c=id(now),last=s.slots.at(-1),open=now<st(c)+WIN;return(last===c||(last===c-1&&open))?run(s.slots.length-1):0}
function fmt(ms){let q=Math.ceil(Math.max(0,ms)/1000),m=Math.floor(q/60);return String(m).padStart(2,"0")+":"+String(q%60).padStart(2,"0")}
function update(){let now=Date.now(),c=id(now),e=now-st(c),charge=Math.min(1,e/SLOT),open=!s.slots.includes(c);document.getElementById("charge").textContent=Math.round(charge*100)+"%";document.querySelectorAll(".leafShape").forEach((x,i)=>{
 let v=Math.max(0,Math.min(1,charge*4-i));
 x.style.opacity=0.38+v*0.62;
 x.classList.toggle("on",v>.05);
 x.style.filter=v>.98?"drop-shadow(0 3px 5px rgba(90,150,100,.22))":"none";
});let b=document.getElementById("tap");b.disabled=!open;b.classList.toggle("ready",open);document.getElementById("status").textContent=open?"🍀 タップできます":"🍀 タップ完了";document.getElementById("next").textContent=open?"試作品：好きなタイミングでタップできます":"次の10分区切りを待っています";document.getElementById("window").textContent=open?"試作品モード：1分制限なし。10分ごとの実時間スケジュールで記録します":"次の10分区切りで新しいタップができます";let t=today(),r=t/144*100;document.getElementById("today").textContent=t;document.getElementById("rate").textContent=r.toFixed(1)+"%";document.getElementById("bar").style.width=r+"%";document.getElementById("streak").textContent=current(now);document.getElementById("best").textContent=Math.max(s.best,best());document.getElementById("tickets").textContent=s.tickets;tro()}
function tap(){let n=Date.now(),c=id(n),e=n-st(c);if(s.slots.includes(c))return;s.slots.push(c);s.slots.sort((a,b)=>a-b);s.tickets++;s.best=Math.max(s.best,best());save();update()}
function draw(){if(!s.tickets)return;let r=Math.random()*100,z=0,rar="N";for(let w of weights){z+=w[1];if(r<z){rar=w[0];break}}let p=data.filter(x=>x[1]==rar),c=p[Math.floor(Math.random()*p.length)];s.tickets--;if(!s.col.includes(c[0]))s.col.push(c[0]);save();document.getElementById("result").innerHTML='<img class="resultcard" src="'+CARD_IMAGE+'" alt="月夜のフクロウ"><div>🍀 '+c[0]+'　[N / No.001]</div>';cards();update()}
function cards(){document.getElementById("cards").innerHTML=data.map(c=>{let o=s.col.includes(c[0]);return'<div class="card '+(o?'':'locked')+'">'+(o?'<img class="realcard" src="'+CARD_IMAGE+'" alt="月夜のフクロウのトレーディングカード">':'<div class="art">?</div>')+'<b>'+(o?c[0]:"？？？")+'</b><div class="small">N / No.001</div></div>'}).join("")}
function tro(){document.getElementById("trophies").innerHTML=ts.map(t=>{let ok=has(t[1]);return'<div class="trophy '+(ok?'':'locked')+'"><div class="icon">'+(ok?"🏆":"🔒")+'</div><div><b>'+t[0]+'</b><div class="small">'+t[1].toLocaleString()+"回連続タップ</div></div></div>"}).join("")}function has(n){let q=1;for(let i=1;i<s.slots.length;i++){q=s.slots[i]-s.slots[i-1]===1?q+1:1;if(q>=n)return true}return s.slots.length>=n}
document.getElementById("tap").onclick=tap;document.getElementById("draw").onclick=draw;document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".panel").forEach(x=>x.classList.add("hidden"));document.getElementById(b.dataset.tab).classList.remove("hidden");cards();tro();update()});cards();tro();update();setInterval(update,250)})()
</script></body></html>
