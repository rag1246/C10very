<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#72a980"><title>C10very - クロベリー</title>
<style>
:root{--bg:#f2faf4;--card:#fff;--g:#70a97e;--d:#356847;--m:#789082;--line:#d7eadc;--pink:#e997aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#31513b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:620px;margin:auto;padding:20px 16px 40px}
header{text-align:center;padding:8px 0 17px}.logo{font-size:32px;font-weight:900;color:var(--d);letter-spacing:.03em}.logo b{color:var(--g)}.jp{font-size:12px;color:var(--m);letter-spacing:.15em}.tag{font-size:11px;color:var(--m);margin-top:5px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.nav button{border:0;background:#e4f2e7;color:#6f8d78;border-radius:14px;padding:10px 2px;font-weight:800;font-size:10px}.nav button.active{background:var(--g);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:20px;box-shadow:0 8px 28px #35684710}.hero{text-align:center}.status{font-size:13px;font-weight:800;color:var(--g);min-height:20px}.next{font-size:12px;color:var(--m);margin-top:3px}
.clover{width:230px;height:230px;margin:12px auto 4px;position:relative}.leaf{position:absolute;width:98px;height:98px;border-radius:50%;background:#edf6ef;border:4px solid #cfe4d5;transition:.2s;opacity:0}.leaf.on{background:var(--pink);border-color:#df8fa2}.l1{left:66px;top:8px}.l2{left:18px;top:56px}.l3{right:18px;top:56px}.l4{left:66px;bottom:8px}.stem{position:absolute;width:5px;height:42px;background:#91bb9b;left:113px;bottom:0;transform:rotate(18deg);border-radius:8px}.center{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff3f5;border:2px solid #d98a9d;left:104px;top:104px}
.ct{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none}.charge{font-size:29px;font-weight:900;color:var(--d)}.clabel{font-size:10px;font-weight:900;color:var(--m);letter-spacing:.12em}
.tap{width:150px;height:150px;border:0;border-radius:50%;background:linear-gradient(145deg,#efa9b8,#df8399);color:#fff;font-size:27px;font-weight:900;cursor:pointer;box-shadow:0 10px 25px #e0879c40}.tap.ready{animation:pulse 1.2s infinite}.tap:disabled{background:#dce9df;color:#9bafa1;box-shadow:none;animation:none}@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 13px 30px #e0879c55}}
.window{font-size:12px;color:var(--m);margin:10px 0 17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:#f5faf6;border-radius:15px;padding:12px 3px;text-align:center}.stat b{display:block;font-size:21px;color:var(--d)}.stat span{font-size:10px;color:var(--m)}.small{font-size:11px;color:var(--m)}.progress{height:10px;background:#e7f1e9;border-radius:99px;overflow:hidden;margin:10px 0 5px}.progress i{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:.3s}
.ticket{background:#f5faf6;border-radius:18px;padding:15px;text-align:center;margin-bottom:12px}.gacha{width:100%;border:0;border-radius:16px;padding:15px;background:var(--g);color:#fff;font-weight:800;font-size:16px}.result{text-align:center;font-size:18px;font-weight:800;min-height:28px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#f7fbf8;border:1px solid var(--line);border-radius:18px;padding:15px;text-align:center}.art{font-size:45px;margin:7px}.locked{opacity:.45}.trophy{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px}.icon{font-size:26px;width:38px;text-align:center}.hidden{display:none}@media(max-width:390px){.clover{transform:scale(.9);margin-top:-2px;margin-bottom:-10px}.tap{width:132px;height:132px}}
</style></head><body><div class="app">
<header><div class="logo">C<b>10</b>very</div><div class="jp">クロベリー</div><div class="tag">Tap • Collect • Grow</div></header>
<nav class="nav"><button class="active" data-tab="home">HOME</button><button data-tab="gacha">GACHA</button><button data-tab="cards">CARDS</button><button data-tab="trophies">TROPHIES</button></nav>
<section id="home" class="panel"><div class="hero">
<div id="status" class="status">🍀 CHARGING</div><div id="next" class="next">—</div>
<div class="clover"><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div><div class="stem"></div><div class="center"></div><div class="ct"><div><div id="charge" class="charge">0%</div><div class="clabel">CHARGE</div></div></div></div>
<div id="window" class="window">10分かけて四つ葉をチャージします</div><button id="tap" class="tap" disabled>🍀 TAP</button>
<div class="stats"><div class="stat"><b id="today">0</b><span>TODAY / 144</span></div><div class="stat"><b id="streak">0</b><span>CURRENT STREAK</span></div><div class="stat"><b id="best">0</b><span>BEST STREAK</span></div></div>
<div style="margin-top:13px;text-align:left"><div class="small">TODAY PERFECT RATE</div><div class="progress"><i id="bar"></i></div><div id="rate" class="small">0.0%</div></div>
</div></section>
<section id="gacha" class="panel hidden"><div class="ticket"><div class="small">GACHA TICKET</div><strong id="tickets" style="font-size:30px">0</strong><div class="small">100 TAPS = 1 FREE TICKET</div></div><button id="draw" class="gacha">🍀 DRAW</button><div id="result" class="result"></div></section>
<section id="cards" class="panel hidden"><h3>MY CARD COLLECTION</h3><div id="cards" class="grid"></div></section>
<section id="trophies" class="panel hidden"><h3>TROPHY COLLECTION</h3><div id="trophies"></div></section>
</div>
<script>
(()=>{const SLOT=600000,WIN=60000,key="c10very_v1";
const data=[["Mossy Morning","N","🌱"],["Tiny Leaf","N","🍃"],["Green Cat","R","🐈"],["Forest Friend","R","🦉"],["Star Garden","SR","🌟"],["Moon Rabbit","SR","🐇"],["Magic Forest","SSR","🌳"],["Dream Meadow","SSR","🌌"],["Emerald Spirit","UR","💚"],["C10very","UR","🍀"]];
const weights=[["N",60],["R",25],["SR",10],["SSR",4],["UR",1]],ts=[["24 HOURS",144],["3 DAYS",432],["1 WEEK",1008],["1 MONTH",4320]];
let s=load();function load(){try{let x=JSON.parse(localStorage.getItem(key)||"{}");return{slots:[...new Set((x.slots||[]).map(Number))].sort((a,b)=>a-b),tickets:+x.tickets||0,col:x.col||[],best:+x.best||0}}catch(e){return{slots:[],tickets:0,col:[],best:0}}}function save(){localStorage.setItem(key,JSON.stringify(s))}
function id(t=Date.now()){return Math.floor(t/SLOT)}function st(i){return i*SLOT}function day(t){let d=new Date(t);return[d.getFullYear(),d.getMonth(),d.getDate()].join("/")}function today(){let k=day(Date.now());return s.slots.filter(i=>day(st(i))==k).length}
function run(i){let n=1;for(let j=i;j>0;j--){if(s.slots[j]-s.slots[j-1]===1)n++;else break}return n}function best(){let b=0;s.slots.forEach((_,i)=>b=Math.max(b,run(i)));return b}function current(now){if(!s.slots.length)return 0;let c=id(now),last=s.slots.at(-1),open=now<st(c)+WIN;return(last===c||(last===c-1&&open))?run(s.slots.length-1):0}
function fmt(ms){let q=Math.ceil(Math.max(0,ms)/1000),m=Math.floor(q/60);return String(m).padStart(2,"0")+":"+String(q%60).padStart(2,"0")}
function update(){let now=Date.now(),c=id(now),e=now-st(c),charge=Math.min(1,e/SLOT),open=e>=SLOT-WIN&&!s.slots.includes(c);document.getElementById("charge").textContent=Math.round(charge*100)+"%";document.querySelectorAll(".leaf").forEach((x,i)=>{let v=Math.max(0,Math.min(1,charge*4-i));x.style.opacity=v;x.classList.toggle("on",v>.05)});let b=document.getElementById("tap");b.disabled=!open;b.classList.toggle("ready",open);document.getElementById("status").textContent=open?"✨ FULL CHARGE — TAP NOW":s.slots.includes(c)?"🍀 TAP COMPLETE":"🍀 CHARGING";document.getElementById("next").textContent=open?"この1分間だけTAPできます":"満タンまで "+fmt(st(c)+SLOT-now);document.getElementById("window").textContent=open?"四つ葉が満タン！この1分間だけTAPできます":"10分かけて四つ葉が少しずつ満タンになります";let t=today(),r=t/144*100;document.getElementById("today").textContent=t;document.getElementById("rate").textContent=r.toFixed(1)+"%";document.getElementById("bar").style.width=r+"%";document.getElementById("streak").textContent=current(now);document.getElementById("best").textContent=Math.max(s.best,best());document.getElementById("tickets").textContent=s.tickets;tro()}
function tap(){let n=Date.now(),c=id(n),e=n-st(c);if(e<SLOT-WIN||e>=SLOT||s.slots.includes(c))return;s.slots.push(c);s.slots.sort((a,b)=>a-b);if(s.slots.length%100===0)s.tickets++;s.best=Math.max(s.best,best());save();update()}
function draw(){if(!s.tickets)return;let r=Math.random()*100,z=0,rar="N";for(let w of weights){z+=w[1];if(r<z){rar=w[0];break}}let p=data.filter(x=>x[1]==rar),c=p[Math.floor(Math.random()*p.length)];s.tickets--;if(!s.col.includes(c[0]))s.col.push(c[0]);save();document.getElementById("result").textContent=c[2]+" "+c[0]+" ["+c[1]+"]";cards();update()}
function cards(){document.getElementById("cards").innerHTML=data.map(c=>{let o=s.col.includes(c[0]);return'<div class="card '+(o?'':'locked')+'"><div class="art">'+(o?c[2]:"?")+'</div><b>'+(o?c[0]:"Unknown Card")+'</b><div class="small">'+c[1]+'</div></div>'}).join("")}
function tro(){document.getElementById("trophies").innerHTML=ts.map(t=>{let ok=has(t[1]);return'<div class="trophy '+(ok?'':'locked')+'"><div class="icon">'+(ok?"🏆":"🔒")+'</div><div><b>'+t[0]+'</b><div class="small">'+t[1].toLocaleString()+" consecutive taps</div></div></div>"}).join("")}function has(n){let q=1;for(let i=1;i<s.slots.length;i++){q=s.slots[i]-s.slots[i-1]===1?q+1:1;if(q>=n)return true}return s.slots.length>=n}
document.getElementById("tap").onclick=tap;document.getElementById("draw").onclick=draw;document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".panel").forEach(x=>x.classList.add("hidden"));document.getElementById(b.dataset.tab).classList.remove("hidden");cards();tro();update()});cards();tro();update();setInterval(update,250)})()
</script></body></html>
